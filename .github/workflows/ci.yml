name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -color

  test:
    name: Test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux x64, os: ubuntu-latest }
          - { name: Linux arm64, os: ubuntu-24.04-arm }
          - { name: macOS arm64, os: macos-latest }
          - { name: Windows x64, os: windows-latest }
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

      - name: Smoke test the CLI
        shell: bash
        run: node apps/cli/dist/cli.js --version

  package:
    name: Package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Pack and install the npm package
        run: |
          cd apps/cli
          cp ../../LICENSE ../../NOTICE ../../README.md .
          tarball=$(npm pack --silent)
          dir=$(mktemp -d)
          npm install --prefix "$dir" "./$tarball"
          "$dir/node_modules/.bin/switchboard" --version

      - uses: actions/upload-artifact@v7
        with:
          name: npm-package
          path: apps/cli/*.tgz
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: switchboard:ci
          build-args: VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test hosted mode
        run: |
          docker run -d --name sb -p 7690:7690 \
            -e SWITCHBOARD_ADMIN_PASSWORD=ci-password-not-secret \
            -e SWITCHBOARD_PUBLIC_URL=http://localhost:7690 switchboard:ci
          for _ in $(seq 30); do curl -fs localhost:7690/healthz && break; sleep 1; done
          docker exec sb switchboard --version | grep -qxF 0.0.0-ci
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:7690/mcp -H 'content-type: application/json' -d '{}')
          test "$code" = 401
          docker exec sb sh -c 'command -v npx && command -v uvx && command -v python3'
          docker rm -f sb
