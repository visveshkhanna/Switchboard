name: Docs

# Builds and link-checks the docs site on every change to it. Deploys are
# done by Cloudflare Workers Builds, connected to this repository with
# apps/docs as the root directory.
on:
  push:
    branches: [main]
    paths: ["apps/docs/**", "CHANGELOG.md", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/docs/**", "CHANGELOG.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run types:check

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check-links
