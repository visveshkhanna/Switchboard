name: Docs

# Builds and link-checks the docs site on every change to it, and deploys
# it to Cloudflare Workers from main when a CLOUDFLARE_API_TOKEN secret is
# set (with CLOUDFLARE_ACCOUNT_ID as a repository variable).
on:
  push:
    branches: [main]
    paths: ["apps/docs/**", "CHANGELOG.md", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths: ["apps/docs/**", "CHANGELOG.md", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: apps/docs
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: apps/docs/package-lock.json

      - run: npm ci

      - name: Type check
        run: npm run types:check

      - name: Build
        run: npm run build

      - name: Check links
        run: npm run check-links

      - name: Deploy to Cloudflare
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        run: npx wrangler deploy
