name: Bug report
description: Report a reproducible problem with Switchboard
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search [existing issues](https://github.com/visveshkhanna/Switchboard/issues) first, and run `switchboard doctor`: it often says what is wrong. Questions go in [Discussions](https://github.com/visveshkhanna/Switchboard/discussions).

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `switchboard --version`.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: client
    attributes:
      label: AI client
      description: The client connected to Switchboard and its version, e.g. Cursor 2.4, Claude Code 3.1.
    validations:
      required: true

  - type: textarea
    id: servers
    attributes:
      label: MCP servers involved
      description: The upstream servers and how they run (stdio command, HTTP URL). Remove secrets.
    validations:
      required: false

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead, with error messages.
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: switchboard doctor
      description: Output of `switchboard doctor`.
      render: text
    validations:
      required: false
